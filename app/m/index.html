<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>India Risk Monitor — mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../components/styles.css">
<style>
  /* ─── Mobile shell · separate tree, not a desktop reflow ─── */
  html, body { overflow-x: clip; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; -webkit-font-smoothing: antialiased; }

  /* MobileTopbar — minimal */
  .m-topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    background: rgba(10, 13, 18, .85); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--ink-3);
  }
  .m-topbar .brand { color: var(--ink); font-weight: 600; font-size: 13px; }
  .m-topbar .meta { display: flex; gap: 10px; align-items: center; }
  .m-topbar a { color: var(--accent); text-decoration: none; }

  .m-wrap { padding: 0 16px 80px; }

  /* MobileHero · H1 + stress pill + 1 primary tile + Today line */
  .m-hero {
    padding: 28px 0 24px;
    background: radial-gradient(ellipse 600px 360px at 30% -10%, #1a2030 0%, transparent 70%);
  }
  .m-h1 {
    font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .m-stress { margin-bottom: 22px; }
  .m-stress .pill { font-size: 12px; padding: 4px 12px; }

  /* The single primary DisplayTile in mobile (day's primary driver) */
  .m-primary { margin-bottom: 18px; }
  .m-primary .display-tile { background: var(--surface-2); }

  .m-today {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px;
    background: linear-gradient(90deg, var(--accent-soft), transparent);
    border-left: 2px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 12.5px; color: var(--ink-2);
  }
  .m-today .tag { color: var(--accent); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; flex-shrink: 0; padding-top: 1px; }
  .m-today b { color: var(--ink); }
  .m-today a { color: var(--accent); text-decoration: none; }

  /* SectionPills · 6 collapsible <details> */
  .m-sections { margin-top: 28px; display: flex; flex-direction: column; gap: 8px; }
  .m-section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .m-section[open] { border-color: var(--line-2); }
  .m-section > summary {
    list-style: none; cursor: pointer;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  .m-section > summary::-webkit-details-marker { display: none; }
  .m-section .m-pill-name { color: var(--ink); font-weight: 600; font-size: 14.5px; flex-shrink: 0; }
  .m-section .m-pill-meta { color: var(--ink-3); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-section .m-pill-arrow { color: var(--ink-3); font-family: var(--mono); font-size: 14px; transition: transform .2s; flex-shrink: 0; }
  .m-section[open] .m-pill-arrow { transform: rotate(90deg); color: var(--accent); }

  .m-section-body {
    padding: 4px 12px 14px;
    border-top: 1px solid var(--line);
  }

  /* TableRow tweaks for mobile */
  .m-section-body table.metric-table { font-size: 12.5px; }
  .m-section-body table.metric-table td { padding: 10px 6px; }
  .m-section-body table.metric-table .name small { font-size: 10.5px; }
  .m-section-body table.metric-table .num { font-size: 12px; }
  .m-section-body table.metric-table .trend-cell { font-size: 11px; }
  /* Hide vs-5Y col / sparkline width tweak handled by component itself */

  .m-subcluster {
    font-size: 10px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase;
    font-weight: 600; padding: 14px 6px 6px;
  }
  .m-subcluster:first-child { padding-top: 6px; }

  /* Heatmap inside mobile section — scroll horizontally inside the wrapper */
  .m-heatmap-wrap { overflow-x: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }

  /* MetricDrawer override — full-screen on mobile */
  .metric-drawer { width: 100vw !important; }

  /* Sticky bottom CTA — view desktop link */
  .m-footer {
    margin-top: 42px; padding: 24px 4px 12px;
    border-top: 1px solid var(--line);
    color: var(--ink-3); font-size: 12px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .m-footer a { color: var(--accent); text-decoration: none; }

  .page-loading { padding: 80px 0; text-align: center; color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

<!-- MobileTopbar -->
<header class="m-topbar">
  <div class="brand">India Risk Monitor</div>
  <div class="meta">
    <a href="../index.html">Desktop</a>
    <a href="../sources/">Sources</a>
  </div>
</header>

<div class="m-wrap">

  <!-- MobileHero -->
  <section class="m-hero" id="top">
    <h1 class="m-h1" id="m-h1">Loading…</h1>
    <div class="m-stress" id="m-stress"></div>
    <div class="m-primary" id="m-primary"></div>
    <div class="m-today" id="m-today" style="display: none;">
      <span class="tag">Today</span>
      <span class="text"></span>
    </div>
  </section>

  <!-- SectionPills · 6 collapsible -->
  <div class="m-sections" id="m-sections">
    <div class="page-loading">Loading metrics…</div>
  </div>

  <footer class="m-footer">
    <span>Built by <b style="color:var(--ink-2);">Aniket Kulkarni</b></span>
    <a href="../index.html">View desktop →</a>
  </footer>
</div>

<script type="module" src="main.mjs"></script>
</body>
</html>
