<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Risk Monitor</title>
<meta name="description" content="A premium market-risk cockpit for India macro &amp; flows. Built by Aniket Kulkarni.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="components/styles.css">
<style>
  /* ─── Page-level layout (the only page-level CSS, kept minimal) ─── */
  html, body { overflow-x: clip; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; -webkit-font-smoothing: antialiased; }

  /* Topbar — single horizontal band, audit Gate 3 */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 32px;
    background: rgba(10, 13, 18, .85); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--ink-3);
  }
  .topbar .brand { color: var(--ink); font-weight: 600; }
  .topbar .meta { display: flex; gap: 16px; align-items: center; }
  .topbar .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: inline-block; vertical-align: middle; margin-right: 6px; }
  .topbar a { color: var(--ink-2); text-decoration: none; border-bottom: 1px dotted var(--line-2); padding-bottom: 1px; }
  .topbar a:hover { color: var(--accent); border-color: var(--accent); }

  /* Page wrap · uses --gutter token for consistent horizontal breathing room */
  .page-wrap { max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter) 80px; }

  /* Hero · single unified card containing H1 + Today + Score + Drivers */
  .hero {
    padding: 40px 0 32px;
    background: radial-gradient(ellipse 1100px 550px at 30% -10%, #1a2030 0%, transparent 70%);
  }
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 36px;
    width: 100%;
  }
  /* H1 inside card · sub-headline tone (Score is the real headline number) */
  .hero-h1 {
    font-size: 22px; line-height: 1.3; font-weight: 500; letter-spacing: -0.005em;
    margin: 0 0 22px; color: var(--ink-2);
  }
  .hero-lead {
    color: var(--ink-2); font-size: 16.5px; line-height: 1.55;
    margin: 0 0 22px;
  }
  /* Today bullets · directly inside hero-card, no extra panel bg */
  .hero-today {
    margin: 0 0 26px;
  }
  .hero-today .today-bullets {
    padding: 0;
    font-size: 14.5px;
    background: transparent;
    border: none;
  }
  .hero-today .tb-row { font-size: 14px; padding: 6px 8px; }
  .hero-today .tb-head {
    color: var(--accent); font-size: 10.5px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px;
  }
  .hero-today b { color: var(--ink); font-weight: 600; }
  .hero-today a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .hero-today a:hover { text-decoration: underline; }

  /* Divider between Today and Vital Signs · subtle line */
  .hero-divider {
    height: 1px;
    background: var(--line);
    margin: 0 0 26px;
  }

  /* Hero vital-signs container · sits inside hero-card, no extra bg */
  .hero-decks { display: block; width: 100%; }
  .hero-decks .hero-vital {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
  }

  @media (max-width: 700px) {
    .hero-card { padding: 22px 20px; border-radius: 10px; }
  }

  /* Sections — uses .section-frame from components/styles.css; just adjust spacing here */
  main.body { margin-top: 16px; }

  /* Hormuz primary — full chart inline (Pattern 4) */
  .hormuz-primary svg { max-width: 100%; height: auto; display: block; }
  .display-tile svg, .spark-cell svg, .dt-spark svg { max-width: 100%; }
  .hormuz-primary {
    background: linear-gradient(180deg, #1a0c0c, #15090c);
    border: 1px solid #3a1c1c;
    border-radius: 14px;
    padding: 28px 32px;
    margin-bottom: 22px;
  }
  .hormuz-primary .hp-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .hormuz-primary .hp-eyebrow { font-size: 11px; color: #ec7a7a; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  .hormuz-primary .hp-value { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; font-family: var(--mono); color: #ec7a7a; line-height: 1; margin-top: 14px; }
  .hormuz-primary .hp-meta { display: flex; gap: 14px; align-items: baseline; margin-top: 12px; color: var(--ink-2); font-size: 13px; }
  .hormuz-primary .hp-meta b { color: var(--ink); font-family: var(--mono); }
  .hormuz-primary .hp-trends { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); margin-top: 14px; }
  .hormuz-primary .hp-trends b { color: #ec7a7a; font-family: var(--mono); font-weight: 500; font-size: 15px; margin-left: 6px; }
  .hormuz-primary .hp-context { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #3a1c1c; }
  .hormuz-primary .hp-context > div .lbl { font-size: 10.5px; color: #b88282; letter-spacing: .08em; text-transform: uppercase; }
  .hormuz-primary .hp-context > div .val { color: var(--ink-2); font-size: 12px; line-height: 1.5; margin-top: 6px; }
  @media (max-width: 700px) { .hormuz-primary .hp-context { grid-template-columns: 1fr 1fr; } }

  /* Section primary tile + table layout */
  .sec-primary-row { display: grid; grid-template-columns: 1.3fr 2fr; gap: 18px; margin-bottom: 18px; }
  .sec-primary-row.dual { grid-template-columns: 1fr 1fr; }
  .sec-table-frame { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 18px; overflow-x: auto; }
  @media (max-width: 900px) { .sec-primary-row, .sec-primary-row.dual { grid-template-columns: 1fr; } }

  /* Sub-cluster headers (Real Economy) */
  .subcluster-head {
    font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase;
    font-weight: 600; margin: 22px 0 8px; padding-top: 8px; border-top: 1px dashed var(--line);
  }
  .subcluster-head:first-child { margin-top: 0; padding-top: 0; border-top: none; }

  /* Footer */
  .page-footer {
    margin-top: 80px; padding: 28px 32px;
    border-top: 1px solid var(--line);
    color: var(--ink-3); font-size: 12.5px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 14px;
  }
  .page-footer a { color: var(--accent); text-decoration: none; }
  .page-footer a:hover { text-decoration: underline; }

  /* Loading state */
  .page-loading { padding: 120px 0; text-align: center; color: var(--ink-3); font-family: var(--mono); font-size: 13px; }

  @media (max-width: 700px) {
    .topbar { padding: 12px var(--gutter); font-size: 12px; }
    .page-wrap { padding: 0 var(--gutter) 60px; }
    .hero { padding: 24px 0 20px; }
    .hero-h1 { font-size: 18px; margin-bottom: 16px; }
    .hero-lead { font-size: 15px; }
  }
  @media (max-width: 460px) {
    .topbar .meta { gap: 10px; }
    .topbar .meta span:first-child { display: none; }
    .topbar .meta a { font-size: 12px; }
  }
</style>
</head>
<body>

<!-- I · Persistent risk-score ticker · mobile-only · slides in when hero scrolls out -->
<div class="risk-ticker" id="risk-ticker" role="button" tabindex="0" aria-label="Scroll to top">
  <span class="rt-label">India Risk</span>
  <span class="rt-score" id="rt-score">–</span>
  <span class="rt-sep">·</span>
  <span class="rt-status" id="rt-status">–</span>
  <span class="rt-sep" id="rt-shocks-sep" style="display:none">·</span>
  <span class="rt-shocks" id="rt-shocks" style="display:none"></span>
  <span class="rt-arrow">↑</span>
</div>

<!-- G · Pull-to-refresh visual · mobile-only -->
<div class="pull-refresh" id="pull-refresh"><span class="pr-arrow">↓</span></div>

<!-- Topbar — the ONLY nav band before hero (Gate 3) -->
<header class="topbar">
  <div class="brand">India Risk Monitor</div>
  <div class="meta">
    <span><span class="dot"></span><span id="topbar-asof">…</span></span>
    <button class="cmdk-hint" id="cmdk-hint" aria-label="Open command palette">Search <span class="kbd">⌘K</span></button>
    <a href="./sources/" id="topbar-sources">Sources &amp; methodology →</a>
  </div>
</header>

<div class="page-wrap">

  <!-- HERO · single unified card · H1 + Today + Score + Drivers -->
  <section class="hero" id="top">
    <div class="hero-card" id="hero-card">
      <h1 class="hero-h1" id="hero-h1">Loading risk read…</h1>
      <div class="hero-today" id="hero-today" style="display: none;"></div>
      <div class="hero-divider" id="hero-divider" style="display: none;"></div>
      <div class="hero-decks" id="hero-decks">
        <div class="hero-skeleton" aria-hidden="true">
          <div class="skel-line w-40"></div>
          <div class="skel-line tall w-60"></div>
          <div class="skel-line w-90"></div>
          <div class="skel-line w-90"></div>
          <div class="skel-line w-60"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- TAB BAR · sticky below topbar (desktop) -->
  <nav class="tab-bar" id="tab-bar" aria-label="Section tabs"></nav>

  <!-- BOTTOM TAB BAR · mobile only · 5 primary + (auto-hidden 'all') -->
  <nav class="bottom-tab-bar" id="bottom-tab-bar" aria-label="Section tabs (mobile)"></nav>

  <!-- BODY · sections render here, hidden/shown by tab state -->
  <main class="body" id="body"></main>

  <!-- FOOTER -->
  <footer class="page-footer">
    <div>Built by <b style="color: var(--ink-2);">Aniket Kulkarni</b></div>
    <a href="./sources/">View full source map →</a>
  </footer>

</div>

<script type="module" src="main.mjs"></script>
</body>
</html>
