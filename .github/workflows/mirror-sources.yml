name: Daily content mirror

# Resilience layer: snapshots every critical source URL daily into git.
# Combined with cache-fallback in fetchResilient(), this ensures the
# dashboard keeps working even when PIB/NHAI/etc are temporarily down.
#
# 2026-05-29: moved from the self-hosted Windows India runner to ubuntu-latest.
# India-IP sources are reached via the CF Worker proxy (fetch-resilient falls
# back to it automatically), so no physical runner is needed and this no longer
# gets cancelled when that machine is offline.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily (~08:30 IST · before most ingest cycles)
  workflow_dispatch:

# concurrency block removed 2026-05-28 — it cancelled queued runs (see ingest.yml note).
# Push race is handled by rebase-retry in the commit step.

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Run mirror
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: node scripts/mirror-sources.mjs
        continue-on-error: true

      - name: Commit cache updates if any
        run: |
          git config user.name "IRM Mirror Bot"
          git config user.email "irm-mirror@bot.local"
          git add data/source-cache
          if git diff --staged --quiet; then
            echo "No cache changes."
          else
            git commit -m "chore: daily source mirror"
            for attempt in 1 2 3; do
              if git push 2>&1; then break; fi
              echo "Push attempt $attempt failed — rebasing on remote and retrying"
              git merge --abort 2>/dev/null || git rebase --abort 2>/dev/null || true
              git pull --no-rebase --no-edit -X ours origin main 2>&1 || true
              sleep $((attempt * 5))
              if [ $attempt -eq 3 ]; then echo "::error::Push failed after 3 attempts"; exit 1; fi
            done
          fi
