name: Freshness audit

# Independent daily check of the LIVE bundled data.json for staleness.
# Decoupled from the noisy ingest workflow so signal isn't drowned out.
# Reads the deployed site directly (not the local repo) so it catches
# deploy-pipeline issues too.
#
# Fires Telegram alert if anything is stale-by-cadence; never fails the
# workflow itself unless infrastructure breaks (then it CAN'T audit, which
# is also worth knowing).

on:
  schedule:
    # 3×/day GH-side layer (the CF Worker watchdog checks every 3h independently).
    # 03:30, 09:00, 14:30 UTC ≈ 09:00, 14:30, 20:00 IST — morning, pre-open, evening.
    - cron: '0 9 * * *'
    - cron: '30 3 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

# Independent from data-push workflows — read-only check.
concurrency:
  group: irm-freshness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
      actions: write        # allows auto-heal: dispatch ingest.yml via ambient GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run freshness audit
        id: audit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/freshness-audit.mjs --json-output > /tmp/audit.json
          STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/audit.json','utf8')).overall_status)")
          echo "overall_status=$STATUS" >> $GITHUB_OUTPUT
          # Re-run in human-readable mode to print + send Telegram
          node scripts/freshness-audit.mjs

      - name: Auto-heal · dispatch fresh ingest if RED (ambient token, no PAT)
        if: steps.audit.outputs.overall_status == 'red'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Bound the heal: skip if an ingest already ran in the last 2h (it's
          # already trying). Otherwise dispatch a full refresh. No extra secret —
          # uses the workflow's own GITHUB_TOKEN + actions:write permission.
          LAST=$(gh run list --workflow ingest.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
          NOW=$(date -u +%s)
          AGE=999999
          if [ -n "$LAST" ]; then AGE=$(( (NOW - $(date -u -d "$LAST" +%s)) / 60 )); fi
          if [ "$AGE" -lt 120 ]; then
            echo "Last ingest ran ${AGE}min ago (<120) — skipping heal, already refreshing."
          else
            echo "RED + last ingest ${AGE}min ago — triggering auto-heal (ingest slot=all)."
            if gh workflow run ingest.yml -f slot=all 2>&1; then
              [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -fsS -m 10 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=🔧 IRM auto-heal: freshness RED → dispatched ingest slot=all (GitHub audit)" >/dev/null || true
            fi
          fi

      - name: Watchdog-liveness · alert if CF Worker is down (mutual monitoring)
        if: always()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # The CF Worker watches GitHub/Pages; this watches the Worker. If the
          # independent watchdog itself is down, that silence would otherwise go
          # unnoticed — so this pings its /health and alerts on failure.
          # (Replaces the need for an external healthchecks.io account for the
          #  common single-failure case.)
          if [ -z "$CF_WORKER_URL" ]; then echo "(no CF_WORKER_URL — skipping)"; exit 0; fi
          BASE="${CF_WORKER_URL%/}"; BASE="${BASE%/proxy}"
          if curl -fsS -m 15 "${BASE}/health" | grep -q '"ok":true'; then
            echo "CF Worker watchdog alive."
          else
            echo "::warning::CF Worker watchdog /health failed."
            [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -fsS -m 10 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🔴 IRM watchdog DOWN: CF Worker /health not responding. The independent watchdog is offline — investigate." >/dev/null || true
          fi

      - name: Open or update GitHub issue if red
        if: steps.audit.outputs.overall_status == 'red'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create freshness-alert --description "Freshness audit · auto-managed" --color "e88080" 2>/dev/null || true

          ISSUE=$(gh issue list --label freshness-alert --state open --json number --jq '.[0].number // empty')

          BODY=$(node -e "
            const a = JSON.parse(require('fs').readFileSync('/tmp/audit.json','utf8'));
            const lines = [
              '## 🔴 Freshness audit · RED',
              '',
              '- Bundle generated: ' + a.bundle_generated_at + ' (' + a.bundle_age_hours + 'h ago)',
              '- IRS: ' + (a.irs_value === null ? '**NULL** (' + a.irs_score_state + ')' : a.irs_value),
              '- ' + a.healthy_count + ' healthy · ' + a.stale_count + ' stale · ' + a.severely_stale_count + ' severely stale of ' + a.total_metrics_checked,
              '',
              '### Severely stale (>2× cadence)',
              ...(a.severely_stale_metrics || []).map(s => '- \`' + s.id + '\` · ' + s.cadence + ' · ' + s.ageDays + 'd / ' + s.thresholdDays + 'd threshold'),
              '',
              '### Stale (>1× cadence)',
              ...(a.stale_metrics || []).map(s => '- \`' + s.id + '\` · ' + s.cadence + ' · ' + s.ageDays + 'd / ' + s.thresholdDays + 'd threshold'),
              '',
              'Auto-managed by freshness-audit.yml. Auto-closes when overall_status returns to green.'
            ];
            console.log(lines.join('\n'));
          ")

          if [ -n "$ISSUE" ]; then
            gh issue edit $ISSUE --body "$BODY"
          else
            gh issue create --label freshness-alert --title "🔴 Freshness audit alert" --body "$BODY"
          fi

      - name: Close freshness issue if green
        if: steps.audit.outputs.overall_status == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label freshness-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue close $ISSUE --comment "Freshness recovered to green at $(date -u +%Y-%m-%dT%H:%MZ). Auto-closed."
          fi
