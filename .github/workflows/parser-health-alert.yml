name: Parser health alert

# Runs after every Scheduled-ingest workflow completes.
# If data/parser-health.json shows any parser in 'red' (3+ consecutive failures
# OR no success in 2× cadence_days), opens or updates a GitHub issue tagged
# 'parser-health'. One issue per run-batch · gets closed automatically when
# all parsers return to green.

on:
  workflow_run:
    workflows: ["Scheduled ingest"]
    types: [completed]

jobs:
  alert:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure parser-health label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create parser-health \
            --repo ${{ github.repository }} \
            --description "Parser health alert · auto-managed" \
            --color "e88080" 2>/dev/null || echo "label exists"

      - name: Read parser health
        id: health
        run: |
          if [ ! -f data/parser-health.json ]; then
            echo "no_health_file=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Counts via Node (no jq dependency · also avoids bash-interpolating URLs in error messages)
          node -e "
            const h = require('./data/parser-health.json');
            const s = h.summary || {green:0,amber:0,red:0};
            console.log('SUMMARY=' + JSON.stringify(s));
            console.log('RED_COUNT=' + (s.red || 0));
            console.log('AMBER_COUNT=' + (s.amber || 0));
          " | tee -a $GITHUB_OUTPUT
          # Body markdown · WRITE TO FILE not GITHUB_OUTPUT (URLs in errors break bash heredocs)
          node -e "
            const h = require('./data/parser-health.json');
            const reds = Object.entries(h.parsers || {}).filter(([k,v]) => v.status === 'red');
            const lines = reds.map(([id, p]) => {
              const lastSuccess = p.last_success_at || 'never';
              const reason = (p.last_failure_reason || 'n/a').replace(/[\`]/g, \"'\");
              return '- **' + id + '** · ' + (p.consecutive_failures || 0) + ' consecutive failures · last success: ' + lastSuccess + '\n  - error: ' + reason;
            });
            require('fs').writeFileSync('/tmp/red-body.md', lines.join('\n\n'));
          "

      - name: Find existing health issue
        id: find
        if: steps.health.outputs.no_health_file != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --repo ${{ github.repository }} --label parser-health --state open --json number --jq '.[0].number // empty')
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

      - name: Close existing issue if all green
        if: steps.health.outputs.no_health_file != 'true' && steps.health.outputs.RED_COUNT == '0' && steps.find.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ steps.find.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --comment "All parsers returned to green status as of $(date -u +%Y-%m-%dT%H:%MZ). Auto-closed."

      - name: Open or update issue if reds present
        if: steps.health.outputs.no_health_file != 'true' && steps.health.outputs.RED_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build full body in a file (no bash interpolation of URLs in error messages)
          {
            echo "# 🔴 Parser health · ${{ steps.health.outputs.RED_COUNT }} red · ${{ steps.health.outputs.AMBER_COUNT }} amber"
            echo ""
            echo "## Red parsers (need attention)"
            echo ""
            cat /tmp/red-body.md
            echo ""
            echo "---"
            echo ""
            echo "Auto-generated by \`.github/workflows/parser-health-alert.yml\` after [run ${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})."
            echo "See \`scripts/parser-health.mjs\` for status thresholds. Auto-closes when all parsers return to green."
          } > /tmp/issue-body.md

          if [ -n "${{ steps.find.outputs.issue_number }}" ]; then
            gh issue edit ${{ steps.find.outputs.issue_number }} \
              --repo ${{ github.repository }} \
              --body-file /tmp/issue-body.md
            gh issue comment ${{ steps.find.outputs.issue_number }} \
              --repo ${{ github.repository }} \
              --body "Updated · still ${{ steps.health.outputs.RED_COUNT }} red as of $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            gh issue create \
              --repo ${{ github.repository }} \
              --title "🔴 Parser health · ${{ steps.health.outputs.RED_COUNT }} red" \
              --label parser-health \
              --body-file /tmp/issue-body.md
          fi
