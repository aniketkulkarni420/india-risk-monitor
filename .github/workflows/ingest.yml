name: Scheduled ingest

on:
  schedule:
    # daily_06 — fire at 3 different times for GitHub-free-tier redundancy.
    # Free crons are best-effort. Skip-if-fresh logic in ingest dedups retries.
    - cron: '30 0 * * *'      # 06:00 IST · daily_06 primary
    - cron: '15 1 * * *'      # 06:45 IST · daily_06 retry-1
    - cron: '0 2 * * *'       # 07:30 IST · daily_06 retry-2
    # Other slots — primary + 1 retry each
    - cron: '30 11 * * 1-5'   # 17:00 IST · weekday_close primary
    - cron: '15 12 * * 1-5'   # 17:45 IST · weekday_close retry
    - cron: '30 13 * * 1-5'   # 19:00 IST · weekday_evening primary
    - cron: '15 14 * * 1-5'   # 19:45 IST · weekday_evening retry
    # fri_17 moved 2026-05-26: previous '30 11 * * 5' collided with weekday_close
    # primary at the same minute on Fridays. GitHub Actions deduplicates same-time
    # cron triggers, so only weekday_close fired Fridays — fri_17 never ran and the
    # 4 Weekly metrics rotted (May 15 → May 26 unrefreshed).
    - cron: '0 8 * * 5'       # 13:30 IST Fri · fri_17 primary (no collision)
    - cron: '30 4 1 * *'      # 10:00 1st · monthly_1
    - cron: '30 4 5 * *'      # 10:00 5th · monthly_5
  workflow_dispatch:
    inputs:
      slot:
        description: 'Manual slot override (defaults to daily_06)'
        required: false
        default: 'daily_06'
        type: choice
        options:
          - daily_06
          - weekday_close
          - weekday_evening
          - fri_17
          - monthly_1
          - monthly_5
          - all

# Serialise all workflows that push to main · prevents the 19:08 UTC race
# observed 2026-05-25 where two scheduled runs committed simultaneously and
# the loser was rejected with "(fetch first)". cancel-in-progress: false
# queues rather than cancels — never drop a successful ingest's data.
concurrency:
  group: irm-data-push
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Install Playwright chromium
        # Several parsers (moneycontrol_v1, bse_v1, playwright_render_v1, web_llm_v1,
        # google_news_llm_v1 redirect resolver) need a real chromium binary. The npm
        # `playwright` package alone does NOT bring the browser — Issue #2 surfaced
        # `Executable doesn't exist at /home/runner/.cache/ms-playwright/chromium_*`
        # for ~9 parsers. This installs the binary to the standard cache path.
        run: npx playwright install --with-deps chromium

      - name: Security audit (warn only)
        run: npm audit --audit-level=high || true

      - name: Generate SBOM (Software Bill of Materials)
        run: npm sbom --omit=dev --sbom-format=cyclonedx > /tmp/sbom.json 2>/dev/null || echo "{}" > /tmp/sbom.json
        continue-on-error: true

      - name: Determine slot from cron schedule
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "30 0 * * *"|"15 1 * * *"|"0 2 * * *")      echo "slot=daily_06" >> $GITHUB_OUTPUT ;;
            "30 11 * * 1-5"|"15 12 * * 1-5")            echo "slot=weekday_close" >> $GITHUB_OUTPUT ;;
            "30 13 * * 1-5"|"15 14 * * 1-5")            echo "slot=weekday_evening" >> $GITHUB_OUTPUT ;;
            "0 8 * * 5")      echo "slot=fri_17" >> $GITHUB_OUTPUT ;;
            "30 4 1 * *")     echo "slot=monthly_1" >> $GITHUB_OUTPUT ;;
            "30 4 5 * *")     echo "slot=monthly_5" >> $GITHUB_OUTPUT ;;
            *)                echo "slot=daily_06" >> $GITHUB_OUTPUT ;;
          esac

      - name: Run live ingest for slot
        env:
          # Free LLM extraction fallback (Step 11) — used only when other parsers fail
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # data.gov.in resource API (Step 7) — used for CPI / petroleum / structured datasets
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
          # CF Worker proxy — fallback for India-IP-restricted sources from cloud runners
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          # Gmail IMAP — PIB / MoSPI / RBI email pipeline
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Telegram alerting (parser-health + anomalies)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.slot.outputs.slot }}" = "all" ]; then
            npm run ingest -- --live --slot=all
          else
            npm run ingest -- --live --slot=${{ steps.slot.outputs.slot }}
          fi
        continue-on-error: true

      - name: Validate updated data (Gate 2)
        run: npm run validate

      - name: Commit data updates if any changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage data/ + the parser-health log explicitly · the latter is part of system observability
          git add data/ data/parser-health.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "ingest: ${{ steps.slot.outputs.slot }} @ $(date -u +%Y-%m-%dT%H:%MZ)"
            # Defensive push: rebase + retry if remote moved between checkout and push.
            # Concurrency block above should prevent this, but cross-workflow edge cases
            # (manual push, scheduled-trigger drift on busy GH days) can still race.
            for attempt in 1 2 3; do
              if git push 2>&1; then
                echo "Push succeeded on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed — rebasing on remote and retrying"
              git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; true; }
              sleep $((attempt * 5))
              if [ $attempt -eq 3 ]; then
                echo "::error::Push failed after 3 attempts · this ingest's data was NOT recorded · investigate"
                exit 1
              fi
            done
          fi
