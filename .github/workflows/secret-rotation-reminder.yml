name: Secret rotation reminder

# Opens a quarterly GitHub issue reminding to rotate API keys (LLM providers,
# data.gov.in, CF Worker, R2). Helps prevent silent expiry.

on:
  schedule:
    - cron: '0 9 1 */3 *'   # 1st of every quarter, 09:00 UTC
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const body = `Quarterly secret rotation reminder · ${today}

            Rotate the following keys to limit blast radius if any has leaked:

            - [ ] \`GROQ_API_KEY\` · regenerate at https://console.groq.com/keys
            - [ ] \`GEMINI_API_KEY\` · regenerate at https://aistudio.google.com/app/apikey
            - [ ] \`CF_API_TOKEN\` · rotate at https://dash.cloudflare.com/profile/api-tokens
            - [ ] \`CLOUDFLARE_API_TOKEN\` (Worker deploy)
            - [ ] \`DATAGOVIN_API_KEY\` · regenerate at https://data.gov.in
            - [ ] \`WORKER_TOKEN\` · regenerate (any random string) + redeploy worker
            - [ ] \`R2_ACCESS_KEY_ID\` + \`R2_SECRET_ACCESS_KEY\` · rotate in CF dash
            - [ ] \`GMAIL_REFRESH_TOKEN\` · re-auth Gmail app at console.cloud.google.com
            - [ ] \`TELEGRAM_BOT_TOKEN\` · /revoke + /newbot via @BotFather

            After rotating each, update via \`gh secret set\` and verify next ingest run succeeds.
            `;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Quarterly secret rotation reminder',
              body,
              labels: ['security', 'maintenance']
            });
