name: Weekly backup to Cloudflare R2

# Disaster-recovery mirror: weekly snapshot of data/ + app/dist/ to R2 (free tier).
# Protects against GitHub repo corruption / accidental deletion.
#
# One-time setup:
#   1. Create R2 bucket at dash.cloudflare.com → R2 → Create bucket "irm-backup"
#   2. R2 → Manage R2 API Tokens → Create API token (R2:Edit scope)
#   3. Add GitHub secrets:
#        R2_ACCOUNT_ID (same as CF_ACCOUNT_ID)
#        R2_ACCESS_KEY_ID
#        R2_SECRET_ACCESS_KEY
#        R2_BUCKET (default "irm-backup")
#
# Storage cost: free tier = 10 GB. Repo's data/ is ~50MB.

on:
  schedule:
    - cron: '0 5 * * 0'   # Sunday 05:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.R2_BUCKET != '' || secrets.R2_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -sL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          region = auto
          EOF

      - name: Sync data/ to R2
        env:
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          rclone copy data/ "r2:${BUCKET}/snapshots/${DATE}/data/" --transfers=8 --quiet
          rclone copy app/dist/ "r2:${BUCKET}/snapshots/${DATE}/dist/" --transfers=4 --quiet
          # Also keep a "latest" pointer
          rclone sync data/ "r2:${BUCKET}/latest/data/" --transfers=8 --quiet
          rclone sync app/dist/ "r2:${BUCKET}/latest/dist/" --transfers=4 --quiet
          echo "Backup complete: ${DATE}"
