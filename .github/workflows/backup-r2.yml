name: Weekly backup to Cloudflare R2

# Disaster-recovery mirror: weekly snapshot of data/ + app/dist/ to Cloudflare R2
# (free tier, 10 GB). Protects against GitHub repo corruption / accidental deletion.
#
# Uses wrangler with the CLOUDFLARE_API_TOKEN you already have set (no separate
# S3 access keys needed). Bundles everything into one dated .tgz + a "latest"
# pointer, so it's a single upload, not thousands of object PUTs.
#
# ONE-TIME SETUP (the only manual step — ~2 min):
#   1. Enable R2: dash.cloudflare.com → R2 → "Enable R2" (free; needs a card on
#      file even for the free tier). This is why the job skips until you do it.
#   2. Make sure CLOUDFLARE_API_TOKEN has the "Workers R2 Storage: Edit"
#      permission (dash → My Profile → API Tokens → edit the token).
#   3. Turn this on: repo → Settings → Secrets and variables → Actions →
#      Variables → New variable:  R2_ENABLED = 1
#      (optional) R2_BUCKET = irm-backup   ← defaults to irm-backup if unset
#   Then: Actions → this workflow → "Run workflow" to verify.
#
# Until R2_ENABLED=1 is set, the job SKIPS (neutral, not failed) — no red noise.

on:
  schedule:
    - cron: '0 5 * * 0'   # Sunday 05:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Gate on a repo VARIABLE (secrets context is NOT allowed in job-level if —
    # that was the old startup-failure bug). Skips cleanly until R2 is enabled.
    if: ${{ vars.R2_ENABLED == '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler ≥4 requires Node ≥22

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Backup data/ + dist/ to R2 (single dated archive + latest)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET || 'irm-backup' }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          # Create the bucket if it doesn't exist yet (idempotent — ignore "exists").
          wrangler r2 bucket create "$BUCKET" 2>&1 | tee /tmp/bkt.log || \
            grep -qiE "already (exists|owned)" /tmp/bkt.log
          # One tarball of everything worth restoring.
          tar czf /tmp/irm-backup.tgz data/ app/dist/ 2>/dev/null || tar czf /tmp/irm-backup.tgz data/
          ls -lh /tmp/irm-backup.tgz
          # Dated snapshot + a stable "latest" pointer.
          wrangler r2 object put "$BUCKET/snapshots/${DATE}.tgz" --file /tmp/irm-backup.tgz --content-type application/gzip
          wrangler r2 object put "$BUCKET/latest.tgz"            --file /tmp/irm-backup.tgz --content-type application/gzip
          echo "Backup complete: ${DATE} → r2://${BUCKET}/snapshots/${DATE}.tgz"
