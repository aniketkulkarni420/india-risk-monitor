name: Deploy Cloudflare Worker

# Deploys irm-india-proxy worker whenever cloudflare-worker/ changes on main.
# Requires GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  · Workers Deploy scope · from dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID · from CF dashboard URL (already set as CF_ACCOUNT_ID earlier)
#   WORKER_TOKEN          · shared secret for runner-to-worker auth
#                          (generate any random string, set in BOTH this secret
#                           AND have parsers send it in X-Worker-Token header)

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cf-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Set worker secrets (proxy auth + watchdog alerting/heal)
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.WATCHDOG_HEALTHCHECK_URL }}
        run: |
          set -e
          put() { # put <NAME> <VALUE> — skip if value empty so partial setup still deploys
            if [ -n "$2" ]; then printf '%s' "$2" | wrangler secret put "$1"; else echo "(skip $1 — secret not set)"; fi
          }
          put WORKER_TOKEN "$WORKER_TOKEN"
          put TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          put GH_DISPATCH_TOKEN "$GH_DISPATCH_TOKEN"
          put HEALTHCHECK_URL "$HEALTHCHECK_URL"

      - name: Deploy worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy
