name: Burst ingest (release-window targeted)

# Many Indian govt metrics release on predictable days of the month:
#   1st-5th    : Auto sales (FADA), eway bills, fastag, rail freight, port cargo
#   10th-15th  : CPI / WPI / IIP (MoSPI)
#   25th-30th  : DPIIT Index of Eight Core Industries
#
# Generic 6h cron misses the release window if everyone's slow. This workflow
# bursts ingest on known release days to catch fresh data sooner.
#
# 2026-05-29: moved from the self-hosted Windows India runner to ubuntu-latest.
# All India-IP sources are reachable via the CF Worker proxy (fetch-resilient +
# nse_api fall back to it automatically), so no physical runner is needed and
# this no longer gets cancelled when that machine is offline.

on:
  schedule:
    # 1st-5th of month at 11:00 IST · auto + monthly govt releases
    - cron: '30 5 1-5 * *'
    # 10th-15th of month at 13:00 IST · CPI/WPI/IIP
    - cron: '30 7 10-15 * *'
    # 25th-30th at 12:00 IST · IECI / Eight Core Industries
    - cron: '30 6 25-30 * *'
  workflow_dispatch:

# concurrency block removed 2026-05-28 — it cancelled queued runs (see ingest.yml note).
# Push race is handled by rebase-retry in the commit step.

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run burst ingest (force, ignores skip-if-fresh)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/ingest-india-loop.mjs --force
        continue-on-error: true

      - name: Validate
        run: npm run validate

      - name: Commit if changes
        run: |
          git config user.name "IRM Burst Runner"
          git config user.email "irm-burst@bot.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "ingest(burst): release-window run"
            for attempt in 1 2 3; do
              if git push 2>&1; then break; fi
              echo "Push attempt $attempt failed — rebasing on remote and retrying"
              git merge --abort 2>/dev/null || git rebase --abort 2>/dev/null || true
              git pull --no-rebase --no-edit -X ours origin main 2>&1 || true
              sleep $((attempt * 5))
              if [ $attempt -eq 3 ]; then echo "::error::Push failed after 3 attempts"; exit 1; fi
            done
          fi
