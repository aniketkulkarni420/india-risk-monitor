name: Scheduled ingest (India IP)

# Runs on the self-hosted Windows runner (label: india) to fetch metrics that
# need an India IP. Uses bash (provided by Git for Windows) to avoid the
# PowerShell ExecutionPolicy restriction on the runner.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h
  workflow_dispatch:
    inputs:
      metric:
        description: 'Single metric_id to ingest (optional)'
        required: false

jobs:
  ingest-india:
    runs-on: [self-hosted, windows, india]
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run live ingest (India geo)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
        run: |
          # Metrics that genuinely need an India IP to fetch (NPCI, NSE, NSDL,
          # DGCA, RBI MMO, PPAC, GSTN, IHMCL etc).
          INDIA_METRICS="wacr_repo_spread fno_oi_buildup block_deals_notional fpi_debt_flows pol_demand air_pax india_port_dwell_time eway_bills fastag_toll rail_freight port_cargo cement_dispatches upi_value india_crude_basket naukri_jobspeak"
          if [ -n "${{ github.event.inputs.metric }}" ]; then
            npm run ingest -- --live --metric=${{ github.event.inputs.metric }} || true
          else
            for m in $INDIA_METRICS; do
              echo "==== Ingesting $m ===="
              npm run ingest -- --live --metric=$m || echo "($m failed, continuing)"
            done
          fi
        continue-on-error: true

      - name: Validate
        run: npm run validate

      - name: Commit data updates if any
        run: |
          git config user.name 'IRM India Runner'
          git config user.email 'irm-india@bot.local'
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "ingest(india): scheduled run @ $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
