name: Scheduled ingest (India Linux runner · Termux/VPS)

# Twin of ingest-india-runner.yml but targets Linux self-hosted runners
# (Termux on Android, or VPS in Mumbai region). Distributes load when both
# are registered. Same metrics list, same secrets.
#
# Register a runner with labels: self-hosted, linux, india

on:
  schedule:
    - cron: '30 */6 * * *'   # offset 30min from Windows runner
  workflow_dispatch:
    inputs:
      metric:
        description: 'Single metric_id to ingest (optional)'
        required: false

jobs:
  ingest-india-linux:
    runs-on: [self-hosted, linux, india]
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Run live ingest for single metric
        if: ${{ github.event.inputs.metric != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
        run: npm run ingest -- --live --metric=${{ github.event.inputs.metric }}
        continue-on-error: true

      - name: Run live ingest loop (all India-IP metrics)
        if: ${{ github.event.inputs.metric == '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
        run: node scripts/ingest-india-loop.mjs
        continue-on-error: true

      - name: Validate
        run: npm run validate

      - name: Commit data updates if any
        run: |
          git config user.name "IRM India Linux Runner"
          git config user.email "irm-india-linux@bot.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "ingest(india-linux): scheduled run"
            git push
          fi
