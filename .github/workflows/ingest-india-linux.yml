name: Scheduled ingest (India Linux runner · Termux/VPS)

# Twin of ingest-india-runner.yml but targets Linux self-hosted runners
# (Termux on Android, or VPS in Mumbai region). Distributes load when both
# are registered. Same metrics list, same secrets.
#
# Register a runner with labels: self-hosted, linux, india

on:
  schedule:
    - cron: '30 */6 * * *'   # offset 30min from Windows runner
  workflow_dispatch:
    inputs:
      metric:
        description: 'Single metric_id to ingest (optional)'
        required: false

# concurrency block removed 2026-05-28 — it cancelled queued runs (see ingest.yml note).
# Push race is handled by rebase-retry in the commit step.

jobs:
  ingest-india-linux:
    runs-on: [self-hosted, linux, india]
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run live ingest for single metric
        if: ${{ github.event.inputs.metric != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run ingest -- --live --metric=${{ github.event.inputs.metric }}
        continue-on-error: true

      - name: Run live ingest loop (all India-IP metrics)
        if: ${{ github.event.inputs.metric == '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAGOVIN_API_KEY: ${{ secrets.DATAGOVIN_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/ingest-india-loop.mjs
        continue-on-error: true

      - name: Validate
        run: npm run validate

      - name: Commit data updates if any
        run: |
          git config user.name "IRM India Linux Runner"
          git config user.email "irm-india-linux@bot.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "ingest(india-linux): scheduled run"
            for attempt in 1 2 3; do
              if git push 2>&1; then break; fi
              echo "Push attempt $attempt failed — rebasing on remote and retrying"
              git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; true; }
              sleep $((attempt * 5))
              if [ $attempt -eq 3 ]; then echo "::error::Push failed after 3 attempts"; exit 1; fi
            done
          fi
